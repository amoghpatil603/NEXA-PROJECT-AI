apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexa-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexa
  template:
    metadata:
      labels:
        app: nexa
    spec:
      containers:
      - name: nexa-core
        image: nexa-platform:latest
        ports:
        - containerPort: 8000
